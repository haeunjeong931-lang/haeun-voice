<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하은 보이스 스튜디오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Do+Hyeon&display=swap">
<style>
/* Layout: 왼쪽 대본 작성 패널 + 오른쪽 문장별 음성 큐(트랙 리스트), 아래 저장 기록. 좁으면 세로로 쌓임 */
:root{
  --bg:#eef0f3; --surface:#fff; --sunk:#e3e6eb; --line:#d3d8df;
  --ink:#16202c; --muted:#5d6877; --accent:#2f5bd3; --accent-ink:#fff;
  --ok:#1d8a5b; --warn:#b26a00; --err:#c43b3b; --busy:#7a4fd6;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10151c; --surface:#18202a; --sunk:#0c1117; --line:#2a3542;
  --ink:#e7ecf2; --muted:#93a0b0; --accent:#7c9cff; --accent-ink:#0d1420;
  --ok:#45c48c; --warn:#f0a53a; --err:#ff6b6b; --busy:#b49aff; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding:20px max(16px,3vw) 48px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.brand h1{font:400 30px/1 var(--f-display);margin:0;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px}
.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.pill.busy{color:var(--busy);background:color-mix(in srgb,var(--busy) 13%,transparent)}
.pill.busy::before{animation:pulse 1s ease-in-out infinite}
.pill.err{color:var(--err);background:color-mix(in srgb,var(--err) 13%,transparent)}
@keyframes pulse{50%{opacity:.25}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px}
.mini:hover:not(:disabled){border-color:var(--accent)}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font:400 21px var(--f-display);margin:0}
.panel-head small{color:var(--muted);font-size:12px}
.panel-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}

textarea#script{width:100%;min-height:260px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;line-height:1.7;font-size:15px}
.hint{font-size:12.5px;color:var(--muted)}
.controls{display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.controls label{font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;min-width:0;accent-color:var(--accent)}
.range output{font:500 13px var(--f-mono);min-width:4.5ch;text-align:right;font-variant-numeric:tabular-nums}
.gen-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 문장 큐 */
ol.lines{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 290px);min-height:220px;overflow-y:auto}
.ln{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 10px;padding:10px;border-radius:10px;border:1px solid transparent}
.ln.playing{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
.ln .n{font:500 12px/2 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ln .txt{border:1px solid transparent;border-radius:6px;padding:3px 6px;margin:-3px -6px;word-break:keep-all;min-width:0}
.ln .txt:hover{border-color:var(--line)}
.ln .txt:focus{border-color:var(--accent);outline:none;background:var(--bg)}
.ln .meta{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ln .acts{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.done{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.busy{color:var(--busy);background:color-mix(in srgb,var(--busy) 13%,transparent)}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.err{color:var(--err);background:color-mix(in srgb,var(--err) 13%,transparent)}
.dur{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font:400 20px var(--f-display);color:var(--ink);margin-bottom:6px}

.save{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.save input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.progress{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--busy);transition:width .3s}
.result{margin:0 18px 14px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.result code{font:13px var(--f-mono);word-break:break-all}

/* 기록 */
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:14px 18px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{font:12px var(--f-mono);color:var(--muted)}
.card audio{width:100%;height:34px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;z-index:9}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)} ol.lines{max-height:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>보이스 스튜디오</h1><span>대본을 넣으면 내 목소리로 읽어 줘요</span></div>
    <div class="hdr-right">
      <span class="pill busy" id="status">목소리 모델 불러오는 중…</span>
      <button class="btn ghost" id="openRoot">저장 폴더 열기</button>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="h-script">
      <div class="panel-head"><h2 id="h-script">대본</h2><small>한 줄에 한 문장씩 쓰면 문장별로 따로 만들어져요</small></div>
      <div class="panel-body">
        <textarea id="script" spellcheck="false"></textarea>
        <div class="hint" id="scriptHint"></div>
        <div class="controls">
          <label>톤</label>
          <div class="seg" role="group" aria-label="톤">
            <button type="button" data-tone="bright" aria-pressed="true">밝게</button>
            <button type="button" data-tone="calm" aria-pressed="false">차분하게</button>
          </div>
          <label for="speed">말 속도</label>
          <div class="range"><input type="range" id="speed" min="0.75" max="1.2" step="0.05" value="0.9"><output id="speedOut">0.90×</output></div>
          <label for="gap">문장 사이 쉼</label>
          <div class="range"><input type="range" id="gap" min="0" max="1" step="0.05" value="0.35"><output id="gapOut">0.35초</output></div>
        </div>
        <div class="gen-row">
          <button class="btn primary" id="genBtn" disabled>음성 만들기</button>
          <button class="btn" id="stopBtn" hidden>멈추기</button>
          <span class="hint" id="eta"></span>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-lines">
      <div class="panel-head">
        <h2 id="h-lines">문장별 음성</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="dur" id="totalDur"></span>
          <button class="mini" id="playAll" disabled>▶ 전체 듣기</button>
        </div>
      </div>
      <div class="progress" aria-hidden="true"><i id="prog"></i></div>
      <ol class="lines" id="lines"></ol>
      <div class="save">
        <input id="title" placeholder="파일 이름 (예: 교토 여행 1편)" maxlength="40">
        <button class="btn primary" id="saveBtn" disabled>저장하기</button>
      </div>
      <div class="result" id="result" hidden></div>
    </section>
  </main>

  <section class="panel" aria-labelledby="h-hist">
    <div class="panel-head"><h2 id="h-hist">저장한 음성</h2><small>문장별 파일(01.wav, 02.wav…)과 전체.wav, 대본.txt가 폴더로 저장돼요</small></div>
    <div class="hist" id="hist"></div>
  </section>
</div>
<audio id="player" hidden></audio>

<script>
const $=s=>document.querySelector(s);
const SAMPLE=`안녕하세요, 오늘은 제가 직접 다녀온 교토 여행 코스를 알려드릴게요.
이거 하나만 알아도 여행 경비 삼십 퍼센트는 아낄 수 있어요.
솔직히 말하면 기대 안 했는데, 한 입 먹자마자 바로 단골 됐어요.
오늘 영상 도움이 됐다면 팔로우 부탁드려요. 다음 편에서 또 만나요!`;
let tone="bright", lines=[], running=false, stopReq=false, ready=false, avgSec=25;

/* ---------- 상태 ---------- */
async function poll(){
  try{
    const s=await (await fetch("/api/status")).json();
    const p=$("#status");
    if(s.error){p.className="pill err";p.textContent="모델 오류: "+s.error;return}
    if(s.ready){ready=true;p.className="pill ok";p.textContent="준비됨";render();return}
    p.className="pill busy";p.textContent=`목소리 모델 불러오는 중… ${s.loading_seconds}초`;
  }catch(e){$("#status").className="pill err";$("#status").textContent="서버 연결 끊김 (실행 창을 확인해 주세요)"}
  setTimeout(poll,2000);
}

/* ---------- 대본 → 문장 ---------- */
function split(text){
  const out=[];
  for(const raw of text.split(/\n+/)){
    const parts=raw.trim().split(/(?<=[.!?~…])\s+/).map(s=>s.trim()).filter(Boolean);
    for(const p of parts){
      if(out.length && out._carry){out[out.length-1]+=" "+p;out._carry=false;continue}
      out.push(p);
    }
  }
  // 너무 짧은 조각(6자 미만)은 다음 문장과 합치기
  const merged=[];
  for(const s of out){ if(merged.length && merged[merged.length-1].replace(/\s/g,"").length<6) merged[merged.length-1]+=" "+s; else merged.push(s) }
  return merged;
}
function scriptHint(){
  const n=split($("#script").value).length;
  $("#scriptHint").textContent = n ? `${n}문장 · 예상 ${fmtMin(n*avgSec)} (그래픽카드 없이 노트북에서 만들어서 문장당 20~40초 걸려요)` : "";
}
const fmtMin=s=>s<60?`${Math.round(s)}초`:`${Math.floor(s/60)}분 ${Math.round(s%60)}초`;
const fmtSec=s=>`${s.toFixed(1)}초`;

/* ---------- 문장 목록 ---------- */
function render(){
  const ol=$("#lines"); ol.innerHTML="";
  if(!lines.length){
    ol.innerHTML=`<li class="empty"><b>아직 만든 음성이 없어요</b>왼쪽에 대본을 쓰고 '음성 만들기'를 누르면 문장마다 여기에 쌓여요.</li>`;
  }
  lines.forEach((L,i)=>{
    const li=document.createElement("li"); li.className="ln"+(L.playing?" playing":""); li.id="ln-"+i;
    const st={wait:["대기","st"],busy:["만드는 중","st busy"],done:["완료","st done"],stale:["문장 바뀜","st warn"],err:["실패","st err"]}[L.state];
    li.innerHTML=`<span class="n">${String(i+1).padStart(2,"0")}</span>
      <div class="txt" contenteditable="${!running}" spellcheck="false"></div>
      <div class="meta"><span class="${st[1]}">${st[0]}</span><span class="dur">${L.seconds?fmtSec(L.seconds):""}</span></div>
      <div class="acts"></div>`;
    li.querySelector(".txt").textContent=L.text;
    li.querySelector(".txt").addEventListener("input",e=>{L.text=e.target.textContent.trim(); if(L.state==="done"){L.state="stale";updateMeta(i)} updateButtons()});
    li.querySelector(".txt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur()}});
    const acts=li.querySelector(".acts");
    const play=mk("▶ 듣기","mini",()=>playOne(i)); play.disabled=!L.url; acts.append(play);
    const redo=mk(L.url?"다시 만들기":"만들기","mini",()=>regen(i)); redo.disabled=running||!ready; acts.append(redo);
    const del=mk("빼기","mini",()=>{lines.splice(i,1);render()}); del.disabled=running; acts.append(del);
    if(L.maybeSkipped) acts.append(Object.assign(document.createElement("span"),{className:"hint",textContent:"빠르게 지나간 부분이 있을 수 있어요. 들어보고 이상하면 다시 만들기"}));
    if(L.error) acts.append(Object.assign(document.createElement("span"),{className:"hint",textContent:L.error}));
    ol.append(li);
  });
  updateButtons();
}
function updateMeta(i){ render() }
function mk(t,c,f){const b=document.createElement("button");b.type="button";b.className=c;b.textContent=t;b.onclick=f;return b}
function updateButtons(){
  $("#genBtn").disabled=!ready||running;
  $("#stopBtn").hidden=!running;
  const allDone=lines.length&&lines.every(L=>L.state==="done");
  $("#saveBtn").disabled=!allDone||running;
  $("#playAll").disabled=!lines.some(L=>L.url);
  const tot=lines.reduce((a,L)=>a+(L.seconds||0),0);
  $("#totalDur").textContent=tot?`총 ${fmtSec(tot)}`:"";
  const done=lines.filter(L=>L.state==="done").length;
  $("#prog").style.width=lines.length?`${done/lines.length*100}%`:"0";
}

/* ---------- 생성 ---------- */
async function makeLine(L,newVariant){
  L.state="busy";L.error="";render();
  const t0=Date.now();
  try{
    const r=await fetch("/api/line",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:L.text,tone,speed:+$("#speed").value,seed:newVariant?null:(L.seed??null)})});
    if(!r.ok){throw new Error((await r.json()).detail||"생성 실패")}
    const d=await r.json();
    Object.assign(L,{id:d.id,url:d.url,seed:d.seed,seconds:d.seconds,maybeSkipped:d.maybe_skipped,state:"done"});
    avgSec=avgSec*0.6+((Date.now()-t0)/1000)*0.4;
  }catch(e){L.state="err";L.error=e.message}
  render();
}
async function runQueue(list){
  running=true;stopReq=false;render();
  for(const L of list){
    if(stopReq)break;
    const left=list.filter(x=>x.state!=="done").length;
    $("#eta").textContent=`남은 문장 ${left}개 · 약 ${fmtMin(left*avgSec)}`;
    await makeLine(L,false);
  }
  running=false;$("#eta").textContent=stopReq?"멈췄어요. 남은 문장은 '만들기'로 하나씩 만들 수 있어요.":"";render();
}
$("#genBtn").onclick=()=>{
  const sents=split($("#script").value);
  if(!sents.length){toast("대본을 먼저 써 주세요.");return}
  lines=sents.map(t=>({text:t,state:"wait"}));
  $("#result").hidden=true;
  runQueue(lines);
};
$("#stopBtn").onclick=()=>{stopReq=true;$("#eta").textContent="지금 만드는 문장까지만 하고 멈춰요…"};
async function regen(i){ if(running)return; running=true; await makeLine(lines[i],true); running=false; render(); playOne(i) }

/* ---------- 재생 ---------- */
const player=$("#player"); let playQueue=[];
function clearPlaying(){lines.forEach(L=>L.playing=false)}
function playOne(i){ playQueue=[]; startPlay(i) }
function startPlay(i){
  clearPlaying(); const L=lines[i]; if(!L||!L.url)return;
  L.playing=true; render(); document.getElementById("ln-"+i)?.scrollIntoView({block:"nearest"});
  player.src=L.url+"?v="+L.id; player.play().catch(()=>{});
}
player.onended=()=>{
  if(playQueue.length){const n=playQueue.shift();setTimeout(()=>startPlay(n),+$("#gap").value*1000)}
  else{clearPlaying();render()}
};
$("#playAll").onclick=()=>{
  const idx=lines.map((L,i)=>L.url?i:-1).filter(i=>i>=0);
  if(!idx.length)return; playQueue=idx.slice(1); startPlay(idx[0]);
};

/* ---------- 저장 ---------- */
$("#saveBtn").onclick=async()=>{
  const btn=$("#saveBtn"); btn.disabled=true;
  try{
    const r=await fetch("/api/export",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title:$("#title").value||lines[0].text.slice(0,20),ids:lines.map(L=>L.id),gap:+$("#gap").value})});
    const d=await r.json(); if(!r.ok)throw new Error(d.detail||"저장 실패");
    const box=$("#result"); box.hidden=false; box.innerHTML="";
    box.append(Object.assign(document.createElement("span"),{textContent:`저장했어요 · ${d.count}문장 · ${fmtSec(d.seconds)}`}));
    const code=document.createElement("code"); code.textContent=d.folder; box.append(code);
    box.append(mk("폴더 열기","mini",()=>openFolder(d.name)));
    const a=document.createElement("a"); a.href=d.url; a.download=d.name+".wav"; a.textContent="전체.wav 내려받기"; a.className="mini"; a.style.textDecoration="none"; box.append(a);
    loadHistory();
  }catch(e){toast(e.message)}
  updateButtons();
};
async function openFolder(name){
  try{const d=await (await fetch("/api/open-folder",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name||""})})).json();
      if(!d.ok)toast("폴더 위치: "+d.path)}catch(e){toast("폴더를 열지 못했어요.")}
}
$("#openRoot").onclick=()=>openFolder("");

async function loadHistory(){
  const box=$("#hist");
  try{
    const items=await (await fetch("/api/history")).json();
    box.innerHTML="";
    if(!items.length){box.innerHTML=`<div class="hint">아직 저장한 음성이 없어요. 문장을 다 만든 뒤 '저장하기'를 누르면 여기에 쌓여요.</div>`;return}
    for(const it of items){
      const c=document.createElement("div"); c.className="card";
      c.innerHTML=`<div class="t"></div><div class="s"></div><audio controls preload="none"></audio>`;
      c.querySelector(".t").textContent=it.first||it.name;
      c.querySelector(".s").textContent=`${it.name} · ${it.lines}문장 · ${fmtSec(it.seconds)}`;
      c.querySelector("audio").src=it.url;
      const row=document.createElement("div"); row.style.display="flex"; row.style.gap="6px";
      row.append(mk("폴더 열기","mini",()=>openFolder(it.name)));
      c.append(row); box.append(c);
    }
  }catch(e){box.innerHTML=`<div class="hint">기록을 불러오지 못했어요.</div>`}
}

/* ---------- 컨트롤 ---------- */
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  tone=b.dataset.tone; document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  if(lines.some(L=>L.state==="done")) toast("톤을 바꿨어요. 이미 만든 문장은 '다시 만들기'를 누르면 새 톤으로 바뀌어요.");
  try{localStorage.setItem("vs.tone",tone)}catch(e){}
});
$("#speed").oninput=e=>{$("#speedOut").textContent=(+e.target.value).toFixed(2)+"×";try{localStorage.setItem("vs.speed",e.target.value)}catch(_){}}
$("#gap").oninput=e=>{$("#gapOut").textContent=(+e.target.value).toFixed(2)+"초";try{localStorage.setItem("vs.gap",e.target.value)}catch(_){}}
$("#script").oninput=()=>{scriptHint();try{localStorage.setItem("vs.script",$("#script").value)}catch(e){}};
let toastT; function toast(m){let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";document.body.append(t)} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),4500)}

(function init(){
  let s=null; try{s=localStorage.getItem("vs.script")}catch(e){}
  $("#script").value=s||SAMPLE;
  try{
    const t=localStorage.getItem("vs.tone"); if(t) document.querySelector(`.seg button[data-tone="${t}"]`)?.click();
    const sp=localStorage.getItem("vs.speed"); if(sp){$("#speed").value=sp}
    const g=localStorage.getItem("vs.gap"); if(g){$("#gap").value=g}
  }catch(e){}
  $("#speedOut").textContent=(+$("#speed").value).toFixed(2)+"×"; $("#gapOut").textContent=(+$("#gap").value).toFixed(2)+"초";
  scriptHint(); render(); poll(); loadHistory();
})();
</script>
